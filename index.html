<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d9f2f6">

  <title>Edutainer Office Inauguration</title>
  <meta name="description"
        content="You're invited to the inauguration of Edutainer's brand new home on Monday, August 31 at 11:00 AM in Bengaluru.">

  <!-- Open Graph / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Edutainer">
  <meta property="og:title" content="Edutainer Office Inauguration">
  <meta property="og:description"
        content="You're invited to the inauguration of Edutainer's brand new home on Monday, August 31 at 11:00 AM in Bengaluru.">
  <meta property="og:url" content="https://bhavanaks249.github.io/">
  <meta property="og:image" content="https://bhavanaks249.github.io/edutainer-inauguration-preview.png?v=4">
  <meta property="og:image:url" content="https://bhavanaks249.github.io/edutainer-inauguration-preview.png?v=4">
  <meta property="og:image:secure_url" content="https://bhavanaks249.github.io/edutainer-inauguration-preview.png?v=4">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1100">
  <meta property="og:image:height" content="1536">
  <meta property="og:image:alt" content="Edutainer office inauguration invitation">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Edutainer Office Inauguration">
  <meta name="twitter:description"
        content="You're invited to the inauguration of Edutainer's brand new home on Monday, August 31 at 11:00 AM in Bengaluru.">
  <meta name="twitter:image" content="https://bhavanaks249.github.io/edutainer-inauguration-preview.png?v=4">

  <style>
    :root {
      --ink:#17303a;
      --gold:#e4c44f;
      --aqua1:#eefbfd;
      --aqua2:#d9f2f6;
      --aqua3:#c5e8ee;
      --ratio:0.7162041182;
    }

    * { box-sizing:border-box; }

    html,body {
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--aqua2);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    .page {
      position:fixed;
      inset:0;
      width:100%;
      height:100vh;
      height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:
        max(10px,env(safe-area-inset-top))
        max(10px,env(safe-area-inset-right))
        max(10px,env(safe-area-inset-bottom))
        max(10px,env(safe-area-inset-left));
      background:
        radial-gradient(circle at 14% 12%,rgba(255,255,255,.96),transparent 29%),
        radial-gradient(circle at 84% 20%,rgba(255,244,191,.42),transparent 25%),
        radial-gradient(circle at 78% 82%,rgba(255,255,255,.78),transparent 31%),
        linear-gradient(145deg,var(--aqua1),var(--aqua2) 48%,var(--aqua3));
    }

    .shell {
      --pad:clamp(8px,1.6vw,14px);
      --reserved:70px;
      flex:0 0 auto;
      width:min(
        calc(100vw - 20px),
        760px,
        calc((100dvh - var(--reserved)) * var(--ratio) + (var(--pad) * 2))
      );
      max-height:calc(100dvh - 20px);
      padding:var(--pad);
      border:1px solid rgba(255,255,255,.82);
      border-radius:clamp(20px,4vw,30px);
      background:rgba(255,255,255,.58);
      box-shadow:0 24px 72px rgba(34,94,109,.18);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      transition:opacity .4s ease,transform .4s ease;
    }

    .eyebrow {
      min-height:26px;
      margin:0 0 9px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      color:#365965;
      font-size:clamp(9px,2.4vw,12px);
      font-weight:800;
      letter-spacing:.2em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .eyebrow::before,.eyebrow::after {
      content:"";
      width:clamp(28px,8vw,44px);
      height:1px;
      background:linear-gradient(to right,transparent,var(--gold));
    }
    .eyebrow::after {
      background:linear-gradient(to left,transparent,var(--gold));
    }

    .invite-wrap {
      position:relative;
      width:100%;
      aspect-ratio:1600/2234;
      overflow:hidden;
      border-radius:clamp(15px,3vw,21px);
      background:#c5e8ee;
      box-shadow:0 10px 30px rgba(21,74,87,.14);
    }

    .invite {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      transform:scale(1.009);
      transform-origin:center;
    }

    .shine {
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(
        115deg,
        transparent 31%,
        rgba(255,255,255,.16) 45%,
        rgba(255,255,255,.05) 52%,
        transparent 68%
      );
      transform:translateX(-125%);
      animation:shine 8s ease-in-out infinite;
    }

    .loading-screen {
      position:fixed;
      inset:0;
      z-index:9999;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 38%,rgba(255,255,255,.96),transparent 30%),
        linear-gradient(145deg,var(--aqua1),var(--aqua2) 48%,var(--aqua3));
      transition:opacity .45s ease,visibility .45s ease;
    }

    .loading-screen.hidden {
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .loader {
      display:grid;
      justify-items:center;
      gap:14px;
      color:#365965;
      font-size:11px;
      font-weight:800;
      letter-spacing:.2em;
      text-transform:uppercase;
    }

    .ring {
      width:48px;
      height:48px;
      border-radius:50%;
      border:3px solid rgba(54,89,101,.15);
      border-top-color:var(--gold);
      animation:spin .85s linear infinite;
    }

    body.loading .shell {
      opacity:0;
      transform:translateY(7px) scale(.99);
    }

    body.ready .shell {
      opacity:1;
      transform:none;
    }

    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes shine {
      0%,67% { transform:translateX(-125%); }
      83%,100% { transform:translateX(125%); }
    }

    @media (max-width:560px) {
      .shell {
        --reserved:64px;
        --pad:8px;
        border-radius:21px;
      }
      .eyebrow {
        min-height:22px;
        margin-bottom:7px;
        letter-spacing:.17em;
      }
      .invite-wrap { border-radius:15px; }
    }

    @media (prefers-reduced-motion:reduce) {
      .ring,.shine { animation:none; }
      .shell,.loading-screen { transition:none; }
    }
  </style>
</head>

<body class="loading">
  <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
    <div class="loader">
      <div class="ring" aria-hidden="true"></div>
      <div>Preparing your invitation</div>
    </div>
  </div>

  <main class="page">
    <section class="shell" aria-label="Edutainer inauguration invitation">
      <div class="eyebrow">You're Invited</div>
      <div class="invite-wrap">
        <img
          id="inviteGif"
          class="invite"
          src="edutainer-inauguration.gif"
          alt="Edutainer office inauguration invitation"
        >
        <div class="shine" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const loader = document.getElementById('loadingScreen');
      const img = document.getElementById('inviteGif');
      const start = performance.now();
      let done = false;

      function finish() {
        if (done) return;
        done = true;
        const delay = Math.max(0, 450 - (performance.now() - start));
        setTimeout(() => {
          document.body.classList.remove('loading');
          document.body.classList.add('ready');
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 500);
        }, delay);
      }

      if (img.complete) requestAnimationFrame(finish);
      else {
        img.addEventListener('load', finish, {once:true});
        img.addEventListener('error', finish, {once:true});
      }

      setTimeout(finish, 6000);
    })();
  </script>
</body>
</html>
